<div class="py-2">
    <div class="metadata-badges">
        <c-badge [color]="BADGE_COLORS[badge.level]" *ngFor="let badge of data.badges" class="px-1 mb-1">{{badge.content}}</c-badge>
    </div>
    <p *ngIf="data.isAuxiliary"><i>Auxiliary node (not part of original plan)</i></p>
    <table cTable hover small class="meta-table">
        <tbody>
        <tr *ngFor="let row of data.displayTable">
            <th scope="row">{{row[0]}}</th>
            <td>{{row[1]}}</td>
        </tr>
        </tbody>
    </table>
</div>
